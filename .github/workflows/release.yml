# Publish a tagged release to npm through TRUSTED PUBLISHING (OIDC).
#
# No token, no OTP: GitHub mints a short-lived OIDC identity, npm verifies it against
# the trusted publisher configured for this package, and the publish is authorised.
# `permissions.id-token: write` is what makes that possible — without it npm falls
# back to a token and fails.
#
# Two things this repository cannot do for you:
#   1. The FIRST version was published interactively (npm requires the package to
#      exist before a trusted publisher can be attached to it — its settings page is
#      where the publisher is configured).
#   2. Someone with publish rights must add the trusted publisher once, at
#      https://www.npmjs.com/package/@sidequest-007/dsh-atlas/access → Trusted Publisher:
#        Organization or user: jameswatt139240-crypto
#        Repository:           dsh-ATLAS
#        Workflow filename:    release.yml       (filename only, not a path)
#        Allowed actions:      publish directly with `npm publish`  ← tick this
#      Leave `npm stage publish` allowed (it is always allowed) if offered.
#
# Publish runs with `--ignore-scripts` because `prepublishOnly` would call
# `pnpm run check`, and typecheck/tests/build need the DSH source checkout that this
# repository's `link:` devDependencies point at. The publish SURFACE is still gated
# below, and `lib/` is committed, so what ships is exactly what was reviewed.
#
# The tag is the release decision: create it only after `pnpm run check` is green.

name: release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # `cache: ''` is how setup-node spells "no package-manager cache"; the
          # previous `package-manager-cache: false` was not a valid input and made
          # every run print an "Unexpected input(s)" warning (observed live).
          cache: ''
      # Trusted publishing needs npm >= 11.5.1. Pin the MAJOR: `npm@latest` is now
      # npm 12, which requires a newer Node than the runner's and changes
      # `npm pack --json` enough to break the gate below (observed live: the gate died
      # on `packed[0].files` when this said `@latest`).
      - name: Use an npm that can do OIDC
        run: npm install --global npm@11 && npm --version
      - name: Publish-surface gate
        run: node scripts/verify-publish-surface.mjs
      # Idempotent: re-pushing a tag (or tagging a version that was already published
      # by hand) must not produce a red run — npm cannot publish over a version.
      - name: Is this version already on npm?
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already published; nothing to do."
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
          fi
      # A prerelease must never take `latest`: that would hand every plain
      # `dsh plugin add @sidequest-007/dsh-atlas` a port build. Tag it with its own
      # prerelease id (`1.0.9-port.6` → `port`) and keep `latest` for stable versions.
      - name: Pick the dist-tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
            *)   tag="latest" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dist-tag for ${version}: ${tag}"
      # No NODE_AUTH_TOKEN on purpose: npm exchanges the OIDC identity itself.
      - name: Publish
        if: steps.published.outputs.already == 'no'
        run: npm publish --ignore-scripts --tag "${{ steps.tag.outputs.tag }}"

  # The gate that can only run AFTER publishing.
  #
  # Everything else in this repository is measured on the working tree. The published
  # artifact is a different thing: a `files` list that drops lib/, a lib/ that was never
  # rebuilt, a build flag that changed the bundle — all invisible to tsc/vitest/build.
  # 1.0.9-port.6 shipped exactly that way (lib/index.js still at 9ca2757, missing the
  # instance-level cache fix from 397f9da) while every local gate was green.
  #
  # This job therefore does what a user does, on a profile that has never seen the
  # package: scaffold a profile from the shipped web template, `dsh plugin add` the
  # version from the PUBLIC registry, boot a host, and compare the client bundle that
  # host serves with the tarball's own lib/client.js.
  acceptance:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ''
      # The harness CLI and the package manager it drives. Pinned: a moving host version
      # would make a red run ambiguous between "our package is broken" and "the host
      # changed under us".
      - name: Install the harness CLI and pnpm
        run: |
          npm install --global @deepseek-ai/dsh@0.2.0-rc.2 pnpm@12
          dsh --version
          pnpm --version
      - name: Install the published version from the registry and load it
        env:
          # Nothing outside the public registry may satisfy this install.
          REGISTRY: https://registry.npmjs.org
        run: |
          version="$(node -p "require('./package.json').version")"
          ./scripts/verify-registry-install.sh "$version"
